services:
  qwen3-vl:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - qwen-cache:/root/.cache/huggingface
    command:
      - --model
      - Qwen/Qwen3-VL-4B-Instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "16384"
      - --api-key
      - ${QWEN_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qwen-cache:
