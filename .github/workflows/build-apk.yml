name: Build Study Arc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      # -------------------------------------------------------
      # 1. DOWNLOAD PROJECT
      # -------------------------------------------------------
      - name: Checkout Study Arc
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. NODE.JS
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # -------------------------------------------------------
      # 3. JAVA FOR ANDROID/GRADLE
      # -------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # -------------------------------------------------------
      # 4. ANDROID SDK
      # -------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------------
      # 5. INSTALL PROJECT
      # -------------------------------------------------------
      - name: Install dependencies
        run: npm install

      # -------------------------------------------------------
      # 6. VERIFY APP CONFIGURATION
      # -------------------------------------------------------
      - name: Show Study Arc configuration
        run: |
          echo "Building Study Arc"
          npx expo config --type public

      # -------------------------------------------------------
      # 7. GENERATE NATIVE ANDROID PROJECT
      # -------------------------------------------------------
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      # -------------------------------------------------------
      # 8. ALLOW GRADLE TO RUN
      # -------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # -------------------------------------------------------
      # 9. BUILD APK
      # -------------------------------------------------------
      - name: Build Study Arc APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # -------------------------------------------------------
      # 10. FIND GENERATED APK
      # -------------------------------------------------------
      - name: Prepare Study Arc APK
        run: |
          mkdir -p output

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" \
            -type f \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" output/StudyArc-v1.0.0.apk

          echo "APK created:"
          ls -lh output/StudyArc-v1.0.0.apk

      # -------------------------------------------------------
      # 11. UPLOAD DOWNLOADABLE APK
      # -------------------------------------------------------
      - name: Upload Study Arc APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.0.0-APK
          path: output/StudyArc-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
