name: Build StudyArc Universal APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: studyarc-universal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    name: Build Android Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_URL }}
      EXPO_PUBLIC_APP_DATABASE_KEY: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_PROVIDER: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_PROVIDER }}
      APP_VERSION: "1.1.7"
      NODE_ENV: production

    steps:
      - name: Checkout StudyArc
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm install --include=dev --no-audit --no-fund

      - name: Align Expo dependencies
        env:
          NODE_ENV: development
        run: npx expo install --fix --npm

      - name: Generate StudyArc brand assets
        run: |
          python -m pip install --quiet Pillow
          python scripts/generate-studyarc-brand-assets.py

      - name: Type-check app
        run: npm run typecheck

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Configure universal release
        run: |
          cat >> android/gradle.properties <<'PROPS'
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.daemon=false
          PROPS

          cat >> android/app/proguard-rules.pro <<'PROGUARD'
          -dontwarn expo.modules.kotlin.services.FilePermissionService
          -dontwarn expo.modules.kotlin.services.FilePermissionService$Permission
          -dontwarn expo.modules.kotlin.types.AnyTypeCache
          -dontwarn expo.modules.kotlin.types.descriptors.RawTypeDescriptor
          -dontwarn expo.modules.kotlin.types.descriptors.TypeDescriptor
          -dontwarn expo.modules.kotlin.types.descriptors.TypeDescriptorKt
          -dontwarn expo.modules.kotlin.types.descriptors.TypeDescriptorOfKt
          PROGUARD

      - name: Build universal release APK
        working-directory: android
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --max-workers=2 \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 \
            2>&1 | tee ../gradle-build.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v${{ env.APP_VERSION }}-Gradle-Diagnostics
          path: |
            gradle-build.log
            android/build/reports/problems/**
            android/app/build/reports/**
            android/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK and ZIP
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          test -n "$APK" || { echo "APK was not generated"; exit 1; }
          cp "$APK" "output/StudyArc-v${APP_VERSION}-universal.apk"
          cd output
          zip -0 "StudyArc-v${APP_VERSION}-universal.zip" "StudyArc-v${APP_VERSION}-universal.apk"
          ls -lh

      - name: Upload APK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v${{ env.APP_VERSION }}-Universal-APK
          path: output/StudyArc-v${{ env.APP_VERSION }}-universal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish release ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-universal
          name: StudyArc v${{ env.APP_VERSION }} Universal APK
          generate_release_notes: true
          files: output/StudyArc-v${{ env.APP_VERSION }}-universal.zip
