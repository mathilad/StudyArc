name: Build StudyArc Normal APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: studyarc-normal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    name: Build Normal Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_URL }}
      EXPO_PUBLIC_APP_DATABASE_KEY: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_PROVIDER: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_PROVIDER }}
      APP_VERSION: "1.1.7"
      NODE_ENV: production

    steps:
      - name: Checkout StudyArc
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm install --include=dev --no-audit --no-fund
      - name: Generate StudyArc brand assets
        run: |
          python -m pip install --quiet Pillow
          python scripts/generate-studyarc-brand-assets.py
      - name: Type-check app
        run: npm run typecheck
      - name: Generate normal Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean
      - name: Build normal release APK
        working-directory: android
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee ../gradle-build.log
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          test -f "$APK"
          BUILD_TOOLS=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "${BUILD_TOOLS}/aapt" dump badging "$APK" | tee apk-badging.txt
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-Normal-Build-Diagnostics
          path: |
            gradle-build.log
            apk-badging.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare APK
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          cp "$APK" "output/StudyArc-v${APP_VERSION}-Normal.apk"
          sha256sum "output/StudyArc-v${APP_VERSION}-Normal.apk" > "output/StudyArc-v${APP_VERSION}-Normal.apk.sha256"
          ls -lh output/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v${{ env.APP_VERSION }}-Normal-APK
          path: |
            output/StudyArc-v${{ env.APP_VERSION }}-Normal.apk
            output/StudyArc-v${{ env.APP_VERSION }}-Normal.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
