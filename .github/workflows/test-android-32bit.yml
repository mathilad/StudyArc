name: StudyArc Android Compatibility Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "assets/**"
      - "components/**"
      - "constants/**"
      - "hooks/**"
      - "android/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-android-32bit.yml"

permissions:
  contents: read

concurrency:
  group: studyarc-android-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-compatibility:
    name: Build and verify 32-bit ARM APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_URL }}
      EXPO_PUBLIC_APP_DATABASE_KEY: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_PROVIDER: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_PROVIDER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Generate Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build APK with 32-bit and 64-bit ARM support
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Verify APK architectures and Android minimum version
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found at $APK"
            find android/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "Checking APK native libraries..."
          unzip -Z1 "$APK" > /tmp/apk-files.txt

          if ! grep -Eq '^lib/armeabi-v7a/[^/]+\.so$' /tmp/apk-files.txt; then
            echo "::error::APK does not contain armeabi-v7a native libraries. It may not run on 32-bit ARM phones."
            exit 1
          fi
          echo "PASS: 32-bit ARM (armeabi-v7a) native libraries found."

          if grep -Eq '^lib/arm64-v8a/[^/]+\.so$' /tmp/apk-files.txt; then
            echo "PASS: 64-bit ARM (arm64-v8a) native libraries found."
          else
            echo "::error::APK does not contain arm64-v8a native libraries."
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "::error::Android aapt tool not found; cannot inspect APK manifest."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'

          MIN_SDK="$(echo "$BADGING" | sed -n "s/^sdkVersion:'\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
          if [ -z "$MIN_SDK" ]; then
            echo "::error::Could not read APK minSdkVersion."
            exit 1
          fi
          if [ "$MIN_SDK" -gt 24 ]; then
            echo "::warning::APK requires Android API $MIN_SDK or newer. Older Android phones will not be supported."
          else
            echo "PASS: APK minimum Android API is $MIN_SDK (Android 7.0/API 24 or lower)."
          fi

          mkdir -p output
          cp "$APK" output/StudyArc-Compatibility-Test.apk
          sha256sum output/StudyArc-Compatibility-Test.apk > output/StudyArc-Compatibility-Test.apk.sha256
          ls -lh output/

      - name: Upload compatibility-test APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-32bit-Compatibility-Test
          path: |
            output/StudyArc-Compatibility-Test.apk
            output/StudyArc-Compatibility-Test.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload logs if the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-Compatibility-Test-Logs
          path: |
            android/**/*.log
            ~/.gradle/daemon/**/*.out.log
          if-no-files-found: ignore
          retention-days: 7
