name: Build Study Arc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: study-arc-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout Study Arc
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Type-check app
        run: npm run typecheck

      - name: Lint app
        continue-on-error: true
        run: npm run lint

      - name: Show Study Arc configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Study Arc APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Study Arc APK
        run: |
          mkdir -p output

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" \
            -type f \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" output/StudyArc-v1.1.0.apk

      - name: Upload Study Arc APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.1.0-APK
          path: output/StudyArc-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30
