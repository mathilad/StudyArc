name: Build Study Arc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app.json
      - package.json
      - app/**
      - assets/**
      - components/**
      - context/**
      - data/**
      - lib/**
      - plugins/**
      - public/**
      - screens/**
      - scripts/**
      - supabase/**
      - .github/workflows/build-apk.yml

permissions:
  contents: write

concurrency:
  group: study-arc-apk-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout Study Arc
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate StudyArc brand assets
        run: |
          python -m pip install --quiet cairosvg
          python scripts/generate-studyarc-brand-assets.py

      - name: Type-check app
        run: npm run typecheck

      - name: Lint app
        continue-on-error: true
        run: npm run lint

      - name: Show Study Arc configuration
        run: npx expo config --type public

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Configure stable minimum-size release
        run: |
          cat >> android/gradle.properties <<'PROPS'
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          reactNativeArchitectures=arm64-v8a
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.daemon=false
          PROPS

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build StudyArc app release APK only
        working-directory: android
        timeout-minutes: 30
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            -PreactNativeArchitectures=arm64-v8a

      - name: Prepare Study Arc v1.1.8 files
        run: |
          mkdir -p output

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" \
            -type f \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" output/StudyArc-v1.1.8-arm64-min.apk
          (cd output && zip -9 StudyArc-v1.1.8-arm64-min.zip StudyArc-v1.1.8-arm64-min.apk)

          python - <<'PY'
          import os, zipfile

          roots = [
              "app", "assets", "components", "constants", "context", "data",
              "desktop", "hooks", "lib", "plugins", "public", "screens", "scripts", "types", "supabase"
          ]
          top = [
              ".env.example", "app.json", "eas.json", "eslint.config.js", "expo-env.d.ts",
              "package.json", "package-lock.json", "tsconfig.json", "BUILD_APK_WINDOWS.bat", "INSTALL_WINDOWS.bat"
          ]
          skip = {
              "assets/images/react-logo.png", "assets/images/react-logo@2x.png",
              "assets/images/react-logo@3x.png", "assets/images/partial-react-logo.png"
          }
          files = []
          for root in roots:
              if not os.path.exists(root):
                  continue
              for base, dirs, names in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in {"node_modules", ".expo", "dist", "build"}]
                  for name in names:
                      path = os.path.join(base, name).replace("\\", "/")
                      if path not in skip:
                          files.append(path)
          files.extend(path for path in top if os.path.exists(path))
          files = sorted(set(files))

          out = "output/StudyArc-v1.1.8-min-source.zip"
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in files:
                  zf.write(path, f"StudyArc-v1.1.8/{path}")
          print(f"Created {out} with {len(files)} files")
          PY

          ls -lh output

      - name: Upload minimum APK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.1.8-Min-APK-ZIP
          path: output/StudyArc-v1.1.8-arm64-min.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload minimum source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.1.8-Min-Source
          path: output/StudyArc-v1.1.8-min-source.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public v1.1.8 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.8
          name: Study Arc v1.1.8
          generate_release_notes: true
          files: |
            output/StudyArc-v1.1.8-arm64-min.apk
            output/StudyArc-v1.1.8-arm64-min.zip
            output/StudyArc-v1.1.8-min-source.zip
