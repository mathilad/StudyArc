name: Deploy StudyArc Cloudflare Data API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Type-check and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Cloudflare Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Worker
        run: npm run typecheck

      - name: Validate D1 configuration
        shell: bash
        run: |
          if grep -q "REPLACE_WITH_YOUR_D1_DATABASE_ID" wrangler.toml; then
            echo "Replace the D1 database ID in cloudflare/wrangler.toml before deploying." >&2
            exit 1
          fi

      - name: Apply D1 schema migrations
        run: npx wrangler d1 migrations apply studyarc-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
