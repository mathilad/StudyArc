name: Validate universal scan review

on:
  push:
    branches:
      - feature/universal-scan-review
    paths:
      - .github/workflows/scan-review-validate.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Expo lint
        run: npm run lint
