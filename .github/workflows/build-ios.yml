name: Build StudyArc iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app.json
      - package.json
      - app/**
      - assets/**
      - components/**
      - context/**
      - data/**
      - lib/**
      - plugins/**
      - screens/**
      - scripts/generate-studyarc-brand-assets.py
      - .github/workflows/build-ios.yml

permissions:
  contents: write

concurrency:
  group: studyarc-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CI: "1"

    steps:
      - name: Checkout StudyArc
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Regenerate validated brand PNGs
        run: |
          python3 -m pip install --user cairosvg
          python3 scripts/generate-studyarc-brand-assets.py
          file assets/images/icon.png assets/images/splash-icon.png assets/images/favicon.png

      - name: Type-check app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Show StudyArc configuration
        run: npx expo config --type public

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d | head -n 1 || true)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" -type d | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          else
            echo "No iOS Xcode project was generated."
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p output/Payload
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1 || true)
          if [ -z "$APP" ]; then
            echo "iPhone app bundle was not generated."
            exit 1
          fi
          ditto "$APP" "output/Payload/$(basename "$APP")"
          cd output
          /usr/bin/zip -qry "StudyArc-v${VERSION}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload StudyArc iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-iOS-IPA
          path: output/StudyArc-v*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
