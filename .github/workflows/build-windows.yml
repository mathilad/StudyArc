name: Build Study Arc Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app.json
      - package.json
      - app/**
      - components/**
      - context/**
      - data/**
      - lib/**
      - plugins/**
      - screens/**
      - desktop/**
      - .github/workflows/build-windows.yml

permissions:
  contents: write

concurrency:
  group: study-arc-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows EXE and Source ZIP
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout Study Arc
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable Windows EXE
        working-directory: desktop
        run: npm run dist -- --publish never

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $exe = Get-ChildItem -Path desktop/dist -Filter "StudyArc-v1.1.5-Windows.exe" -File | Select-Object -First 1
          if (-not $exe) {
            throw "Windows EXE was not generated."
          }
          Copy-Item $exe.FullName output/StudyArc-v1.1.5-Windows.exe
          git archive --format=zip --output=output/StudyArc-v1.1.5-source.zip HEAD

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.1.5-Windows-EXE
          path: output/StudyArc-v1.1.5-Windows.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.1.5-Source-ZIP
          path: output/StudyArc-v1.1.5-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows and source downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          name: Study Arc v1.1.5
          generate_release_notes: true
          files: |
            output/StudyArc-v1.1.5-Windows.exe
            output/StudyArc-v1.1.5-source.zip
