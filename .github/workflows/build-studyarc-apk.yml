name: Build StudyArc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "assets/**"
      - "components/**"
      - "constants/**"
      - "hooks/**"
      - "scripts/**"
      - "android/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/build-studyarc-apk.yml"

permissions:
  contents: read

concurrency:
  group: studyarc-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_URL }}
      EXPO_PUBLIC_APP_DATABASE_KEY: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_KEY }}
      EXPO_PUBLIC_APP_DATABASE_PROVIDER: ${{ secrets.EXPO_PUBLIC_APP_DATABASE_PROVIDER }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Generate native Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build release APK (32-bit and 64-bit ARM)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Verify APK exists
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Release APK was not generated." >&2
            exit 1
          fi
          mkdir -p output
          cp "$APK_PATH" output/StudyArc.apk
          sha256sum output/StudyArc.apk > output/StudyArc.apk.sha256
          echo "APK created:"
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-Android-APK
          path: |
            output/StudyArc.apk
            output/StudyArc.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-APK-Build-Logs
          path: |
            android/**/*.log
            ~/.gradle/daemon/**/*.out.log
          if-no-files-found: ignore
          retention-days: 7
