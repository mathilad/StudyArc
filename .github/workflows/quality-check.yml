name: Study Arc v1.1.2 Quality Check

on:
  push:
    branches:
      - studyarc-platform-upgrade
  pull_request:
    branches:
      - main

concurrency:
  group: study-arc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and web bundle
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout v1.1.2 branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Expo lint
        run: npm run lint

      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist-quality-check
