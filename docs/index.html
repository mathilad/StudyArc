<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#080D14" />
  <title>Study Arc</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080D14;color:#F4F5F7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,520px);background:#101720;border:1px solid #293646;border-radius:26px;padding:32px;text-align:center}.brand{font-size:32px;font-weight:900}.brand span{color:#B784FF}.tag{color:#8E98A7;line-height:1.6;margin:12px 0 0}.button{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;background:#B784FF;color:#160C20;font-weight:900;text-decoration:none;margin-top:24px}.small{color:#647184;font-size:12px;line-height:1.6;margin-top:18px}</style>
</head>
<body>
  <main class="card">
    <div class="brand">Study <span>Arc</span></div>
    <p class="tag">Study Arc uses this secure web page only as a bridge for account verification and password-reset emails on mobile devices.</p>
    <a class="button" href="studyarc://login">OPEN STUDY ARC</a>
    <p class="small">No passwords or study data are stored on this page.</p>
  </main>
</body>
</html>
