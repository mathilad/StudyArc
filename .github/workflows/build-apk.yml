name: Build Study Arc APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: study-arc-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NODE_ENV: production

    steps:
      - name: Checkout Study Arc
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        run: npx expo install --fix --npm

      - name: Generate StudyArc brand assets
        run: |
          python -m pip install --quiet cairosvg
          python scripts/generate-studyarc-brand-assets.py

      - name: Type-check app
        run: npm run typecheck

      - name: Lint app
        continue-on-error: true
        run: npm run lint

      - name: Show Study Arc configuration
        run: npx expo config --type public

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Configure minimum-size release
        run: |
          cat >> android/gradle.properties <<'PROPS'
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          reactNativeArchitectures=arm64-v8a
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.daemon=false
          PROPS

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build StudyArc app release APK only
        working-directory: android
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a \
            2>&1 | tee ../gradle-build.log

      - name: Upload Gradle diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.2.0-Gradle-Diagnostics
          path: |
            gradle-build.log
            android/build/reports/problems/**
            android/app/build/reports/**
            android/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Study Arc v1.2.0 files
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi
          cp "$APK" output/StudyArc-v1.2.0-arm64-min.apk
          (cd output && zip -9 StudyArc-v1.2.0-arm64-min.zip StudyArc-v1.2.0-arm64-min.apk)
          ls -lh output

      - name: Upload minimum APK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyArc-v1.2.0-Min-APK-ZIP
          path: output/StudyArc-v1.2.0-arm64-min.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public v1.2.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Study Arc v1.2.0
          generate_release_notes: true
          files: |
            output/StudyArc-v1.2.0-arm64-min.apk
            output/StudyArc-v1.2.0-arm64-min.zip
