name: StudyArc Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: studyarc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, typecheck, lint and platform bundles
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CI: "1"
    steps:
      - name: Checkout StudyArc
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Regenerate validated brand PNGs
        run: |
          python3 -m pip install --user cairosvg
          python3 scripts/generate-studyarc-brand-assets.py
          file assets/images/icon.png assets/images/splash-icon.png assets/images/favicon.png

      - name: Review production dependency audit
        run: npm run audit:production

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Expo lint
        run: npm run lint

      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist-quality-check

      - name: Export Android JS bundle
        run: npx expo export --platform android --output-dir dist-android-quality-check
