name: Apply universal scan review flow

on:
  push:
    branches:
      - feature/universal-scan-review
    paths:
      - .github/workflows/universal-scan-review-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply-universal-scan-review.py

      - name: Commit source changes
        run: |
          rm -f .github/workflows/universal-scan-review-patch.yml
          rm -f scripts/apply-universal-scan-review.py
          git config user.name "StudyArc Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Require editable review before scanned data is saved"
          git push origin HEAD:feature/universal-scan-review
